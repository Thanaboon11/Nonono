<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Internship Tracker</title>
  <meta name="theme-color" content="#fcf8f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #fbf7ee;
      color: #292524;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px 10px 40px;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.25);
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #292524;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: #78716c;
      font-weight: 600;
    }
    .card {
      background: #ffffff;
      border: 1px solid #ebdccb;
      border-radius: 22px;
      padding: 18px 16px;
      box-shadow: 0 4px 15px rgba(120, 80, 40, 0.05);
    }
    .countdown-card {
      background: linear-gradient(180deg, #ffffff 0%, #fef8ee 100%);
      border: 1.5px solid #f2dbb6;
      text-align: center;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fbeee0;
      color: #c2410c;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .countdown-number {
      font-size: 2.7rem;
      font-weight: 900;
      color: #ea580c;
      line-height: 1.1;
      letter-spacing: -1px;
    }
    .countdown-unit {
      font-size: 1.1rem;
      font-weight: 700;
      color: #78716c;
      margin-left: 4px;
    }
    .countdown-desc {
      font-size: 0.8rem;
      color: #78716c;
      margin-top: 4px;
      font-weight: 600;
    }
    .progress-bar-bg {
      background: #ebdccb;
      border-radius: 10px;
      height: 9px;
      margin: 14px 0 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #ea580c, #f97316);
      height: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #a8a29e;
      font-weight: 600;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #ebdccb;
    }
    .stat-col {
      text-align: center;
    }
    .stat-col-title {
      font-size: 0.68rem;
      color: #78716c;
      margin-bottom: 2px;
    }
    .stat-col-val {
      font-size: 0.95rem;
      font-weight: 800;
      color: #292524;
    }
    .attendance-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #f7efe4;
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid #ebdccb;
      text-align: center;
    }
    .att-item-num {
      font-size: 1.1rem;
      font-weight: 800;
    }
    .att-item-label {
      font-size: 0.7rem;
      color: #57534e;
      font-weight: 600;
    }
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #292524;
    }
    .cal-nav-btn {
      background: #f7efe4;
      border: 1px solid #ebdccb;
      color: #292524;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: #a8a29e;
      margin-bottom: 8px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .cal-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #292524;
      cursor: pointer;
      position: relative;
      background: #fdfaf6;
      border: 1.5px solid transparent;
    }
    .cal-cell.other-month {
      color: #d6d3d1;
      background: transparent;
      opacity: 0.4;
    }
    .cal-cell.today {
      border-color: #ea580c !important;
      color: #ea580c;
      font-weight: 900;
    }
    .cal-cell.selected {
      background: #ea580c !important;
      color: #ffffff !important;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.35);
    }
    .cal-cell.status-present {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }
    .cal-cell.status-leave {
      background: #fef9c3;
      border-color: #fde047;
      color: #854d0e;
    }
    .cal-cell.status-wfh {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1e40af;
    }
    .cal-cell.has-note::after {
      content: '';
      position: absolute;
      bottom: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ea580c;
    }
    .cal-cell.is-holiday::before {
      content: '';
      position: absolute;
      top: 4px;
      right: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ec4899;
    }
    .detail-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .detail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detail-date {
      font-size: 1.05rem;
      font-weight: 800;
      color: #292524;
    }
    .detail-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: #f7efe4;
      color: #57534e;
    }
    .att-btn-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .btn-att {
      padding: 10px 0;
      border-radius: 12px;
      border: 1.5px solid #ebdccb;
      font-size: 0.8rem;
      font-weight: 700;
      background: #ffffff;
      cursor: pointer;
      color: #44403c;
    }
    .btn-att.active-present {
      background: #22c55e;
      color: #fff;
      border-color: #16a34a;
    }
    .btn-att.active-leave {
      background: #eab308;
      color: #fff;
      border-color: #ca8a04;
    }
    .btn-att.active-wfh {
      background: #3b82f6;
      color: #fff;
      border-color: #2563eb;
    }
    .note-box {
      width: 100%;
      height: 80px;
      border-radius: 14px;
      border: 1.5px solid #ebdccb;
      padding: 10px 12px;
      font-size: 0.9rem;
      color: #1c1917;
      background: #fdfcfa;
      resize: none;
      outline: none;
    }
    .note-box:focus {
      border-color: #ea580c;
    }
    .note-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .note-save-btn {
      background: #ea580c;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 8px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .note-del-btn {
      background: transparent;
      color: #dc2626;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .status-msg {
      font-size: 0.75rem;
      color: #16a34a;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .status-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="top-bar">
    <div class="app-brand">
      <div class="brand-icon">🎓</div>
      <div>
        <div class="brand-title">Internship Tracker</div>
        <div class="brand-sub" id="today-text-label">กำลังโหลดข้อมูล...</div>
      </div>
    </div>
  </div>

  <div class="card countdown-card">
    <div class="badge-pill">
      <span>🎯</span> เป้าหมาย 26 ก.พ. 2570
    </div>
    
    <div>
      <span class="countdown-number" id="days-left-num">--</span>
      <span class="countdown-unit">วัน</span>
    </div>
    <div class="countdown-desc" id="countdown-subtext">คำนวณระยะเวลา...</div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
    </div>
    
    <div class="progress-labels">
      <span>เริ่ม: 26 ต.ค. 69</span>
      <span id="progress-percent">0%</span>
      <span>จบ: 26 ก.พ. 70</span>
    </div>

    <div class="stats-row">
      <div class="stat-col">
        <div class="stat-col-title">ผ่านไปแล้ว</div>
        <div class="stat-col-val" id="days-passed-num">-- วัน</div>
      </div>
      <div class="stat-col">
        <div class="stat-col-title">วันทำงานเหลือ</div>
        <div class="stat-col-val" id="workdays-left-num">-- วัน</div>
      </div>
      <div class="stat-col">
        <div class="stat-col-title">วันหยุดที่รออยู่</div>
        <div class="stat-col-val" id="holidays-left-num">-- วัน</div>
      </div>
    </div>
  </div>

  <div class="attendance-box">
    <div>
      <div class="att-item-num" style="color: #16a34a;" id="stat-present-count">0</div>
      <div class="att-item-label">🟢 มาทำงาน</div>
    </div>
    <div>
      <div class="att-item-num" style="color: #ca8a04;" id="stat-leave-count">0</div>
      <div class="att-item-label">🟡 ลางาน</div>
    </div>
    <div>
      <div class="att-item-num" style="color: #2563eb;" id="stat-wfh-count">0</div>
      <div class="att-item-label">🔵 WFH</div>
    </div>
  </div>

  <div class="card">
    <div class="cal-header">
      <button class="cal-nav-btn" id="btn-prev-month">◀</button>
      <div class="cal-title" id="cal-month-title">ปฏิทิน</div>
      <button class="cal-nav-btn" id="btn-next-month">▶</button>
    </div>

    <div class="cal-weekdays">
      <div style="color: #ef4444;">อา</div>
      <div>จ</div>
      <div>อ</div>
      <div>พ</div>
      <div>พฤ</div>
      <div>ศ</div>
      <div style="color: #3b82f6;">ส</div>
    </div>

    <div class="cal-grid" id="cal-grid-container"></div>
  </div>

  <div class="card detail-card">
    <div class="detail-head">
      <div class="detail-date" id="selected-date-title">ข้อมูลประจำวัน</div>
      <div class="detail-badge" id="selected-date-badge">ปกติ</div>
    </div>

    <div class="att-btn-row">
      <button class="btn-att" id="btn-mark-present">🟢 มาทำ</button>
      <button class="btn-att" id="btn-mark-leave">🟡 ลา</button>
      <button class="btn-att" id="btn-mark-wfh">🔵 WFH</button>
      <button class="btn-att" id="btn-mark-clear">⚪ ล้าง</button>
    </div>

    <textarea class="note-box" id="note-input" placeholder="พิมพ์บันทึกงาน โน้ตความจำประจำวันนี้..."></textarea>
    
    <div class="note-actions">
      <button class="note-del-btn" id="btn-del-note">ลบโน้ต</button>
      <span class="status-msg" id="save-status-msg">✓ บันทึกเรียบร้อย</span>
      <button class="note-save-btn" id="btn-save-note">บันทึก</button>
    </div>
  </div>

</div>

<script>
  // ตัวแปรคงที่
  var START_DATE = new Date(2026, 9, 26);
  var END_DATE   = new Date(2027, 1, 26);

  var THAI_MONTHS = [
    "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
    "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
  ];

  var HOLIDAYS = {
    "2026-12-05": "วันพ่อแห่งชาติ",
    "2026-12-07": "ชดเชยวันพ่อแห่งชาติ",
    "2026-12-10": "วันรัฐธรรมนูญ",
    "2026-12-31": "วันสิ้นปี",
    "2027-01-01": "วันขึ้นปีใหม่",
    "2027-02-21": "วันมาฆบูชา",
    "2027-02-22": "ชดเชยวันมาฆบูชา"
  };

  var displayMonth = new Date();
  var selectedDate = new Date();

  function getDateKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function getAttendanceData() {
    try {
      return JSON.parse(localStorage.getItem('intern_attendance') || '{}');
    } catch (e) {
      return {};
    }
  }

  function getNotesData() {
    try {
      return JSON.parse(localStorage.getItem('intern_notes') || '{}');
    } catch (e) {
      return {};
    }
  }

  function updateOverviewStats() {
    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var startNorm = new Date(START_DATE);
    startNorm.setHours(0, 0, 0, 0);

    var endNorm = new Date(END_DATE);
    endNorm.setHours(0, 0, 0, 0);

    document.getElementById('today-text-label').textContent = 'วันนี้: ' + today.getDate() + ' ' + THAI_MONTHS[today.getMonth()] + ' ' + (today.getFullYear() + 543);

    var diffTime = endNorm - today;
    var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    var daysLeftEl = document.getElementById('days-left-num');
    var subtextEl = document.getElementById('countdown-subtext');

    if (diffDays > 0) {
      daysLeftEl.textContent = diffDays;
      var mLeft = Math.floor(diffDays / 30);
      var dLeft = diffDays % 30;
      subtextEl.textContent = '(ประมาณ ' + mLeft + ' เดือน ' + dLeft + ' วัน)';
    } else if (diffDays === 0) {
      daysLeftEl.textContent = "0";
      subtextEl.textContent = "🎉 วันนี้คือวันสิ้นสุดการฝึกงาน!";
    } else {
      daysLeftEl.textContent = "0";
      subtextEl.textContent = "สำเร็จการฝึกงานเรียบร้อยแล้ว";
    }

    var totalDurationDays = 124;
    var passed = Math.floor((today - startNorm) / (1000 * 60 * 60 * 24));
    if (passed < 0) passed = 0;
    if (passed > totalDurationDays) passed = totalDurationDays;

    document.getElementById('days-passed-num').textContent = passed + ' วัน';

    var pct = Math.round((passed / totalDurationDays) * 100);
    if (pct > 100) pct = 100;
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-percent').textContent = pct + '%';

    var cur = new Date(today > startNorm ? today : startNorm);
    var workdaysLeft = 0;
    var holidaysLeft = 0;

    while (cur <= endNorm) {
      var k = getDateKey(cur);
      var dayOfWeek = cur.getDay();
      var isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
      var isHoliday = !!HOLIDAYS[k];

      if (isHoliday) holidaysLeft++;
      if (!isWeekend && !isHoliday) workdaysLeft++;

      cur.setDate(cur.getDate() + 1);
    }

    document.getElementById('workdays-left-num').textContent = workdaysLeft + ' วัน';
    document.getElementById('holidays-left-num').textContent = holidaysLeft + ' วัน';

    var att = getAttendanceData();
    var pCount = 0, lCount = 0, wCount = 0;
    for (var key in att) {
      if (att[key] === 'present') pCount++;
      if (att[key] === 'leave') lCount++;
      if (att[key] === 'wfh') wCount++;
    }
    document.getElementById('stat-present-count').textContent = pCount;
    document.getElementById('stat-leave-count').textContent = lCount;
    document.getElementById('stat-wfh-count').textContent = wCount;
  }

  function renderCalendar() {
    var grid = document.getElementById('cal-grid-container');
    grid.innerHTML = '';

    var y = displayMonth.getFullYear();
    var m = displayMonth.getMonth();

    document.getElementById('cal-month-title').textContent = THAI_MONTHS[m] + ' ' + (y + 543);

    var firstDayIndex = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var prevDays = new Date(y, m, 0).getDate();

    var todayKey = getDateKey(new Date());
    var selKey = getDateKey(selectedDate);
    var attendance = getAttendanceData();
    var notes = getNotesData();

    for (var i = firstDayIndex - 1; i >= 0; i--) {
      var cellPrev = document.createElement('div');
      cellPrev.className = 'cal-cell other-month';
      cellPrev.textContent = prevDays - i;
      grid.appendChild(cellPrev);
    }

    for (var day = 1; day <= daysInMonth; day++) {
      (function(d) {
        var cellDate = new Date(y, m, d);
        var key = getDateKey(cellDate);

        var cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.textContent = d;

        if (key === todayKey) cell.classList.add('today');
        if (key === selKey) cell.classList.add('selected');
        if (HOLIDAYS[key]) cell.classList.add('is-holiday');
        if (notes[key] && notes[key].trim().length > 0) cell.classList.add('has-note');

        if (attendance[key]) {
          cell.classList.add('status-' + attendance[key]);
        }

        cell.onclick = function() {
          selectedDate = new Date(y, m, d);
          renderCalendar();
          updateSelectedDetail();
        };

        grid.appendChild(cell);
      })(day);
    }

    var totalRendered = firstDayIndex + daysInMonth;
    var nextDaysCount = (7 - (totalRendered % 7)) % 7;
    for (var j = 1; j <= nextDaysCount; j++) {
      var cellNext = document.createElement('div');
      cellNext.className = 'cal-cell other-month';
      cellNext.textContent = j;
      grid.appendChild(cellNext);
    }
  }

  function updateSelectedDetail() {
    var key = getDateKey(selectedDate);
    var d = selectedDate.getDate();
    var m = selectedDate.getMonth();
    var y = selectedDate.getFullYear() + 543;

    document.getElementById('selected-date-title').textContent = d + ' ' + THAI_MONTHS[m] + ' ' + y;

    var badge = document.getElementById('selected-date-badge');
    var holidayName = HOLIDAYS[key];
    var dayOfWeek = selectedDate.getDay();

    if (holidayName) {
      badge.textContent = '🎉 ' + holidayName;
      badge.style.background = '#fce7f3';
      badge.style.color = '#be185d';
    } else if (dayOfWeek === 0 || dayOfWeek === 6) {
      badge.textContent = "วันหยุดสุดสัปดาห์";
      badge.style.background = '#fef3c7';
      badge.style.color = '#b45309';
    } else {
      badge.textContent = "วันทำงานปกติ";
      badge.style.background = '#f7efe4';
      badge.style.color = '#57534e';
    }

    var notes = getNotesData();
    document.getElementById('note-input').value = notes[key] || '';

    var attendance = getAttendanceData();
    var currentStatus = attendance[key] || '';

    document.getElementById('btn-mark-present').className = 'btn-att' + (currentStatus === 'present' ? ' active-present' : '');
    document.getElementById('btn-mark-leave').className   = 'btn-att' + (currentStatus === 'leave' ? ' active-leave' : '');
    document.getElementById('btn-mark-wfh').className     = 'btn-att' + (currentStatus === 'wfh' ? ' active-wfh' : '');
  }

  function setAttendance(status) {
    var key = getDateKey(selectedDate);
    var att = getAttendanceData();

    if (!status) {
      delete att[key];
    } else {
      att[key] = status;
    }

    localStorage.setItem('intern_attendance', JSON.stringify(att));
    renderCalendar();
    updateSelectedDetail();
    updateOverviewStats();
  }

  document.getElementById('btn-mark-present').onclick = function() { setAttendance('present'); };
  document.getElementById('btn-mark-leave').onclick   = function() { setAttendance('leave'); };
  document.getElementById('btn-mark-wfh').onclick     = function() { setAttendance('wfh'); };
